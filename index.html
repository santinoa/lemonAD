<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LemonAD Verification</title>
    <style>
        body { background-color: #1e1e1e; color: white; font-family: sans-serif; text-align: center; padding: 50px; }
        .alerta { color: #ff4c4c; font-weight: bold; font-size: 20px; }
        .ad-container { margin-top: 30px; padding: 25px; border: 2px dashed #555; border-radius: 10px; background-color: #2a2a2a; min-height: 100px; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .input-box { padding: 12px; font-size: 16px; width: 250px; border-radius: 5px; border: none; text-align: center; margin-right: 10px; }
        .registrar-btn { padding: 12px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .registrar-btn:hover { background-color: #45a049; }
        #panelVerificacion { margin-top: 20px; }
        #panelActivo { display: none; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>Verificación LemonAD</h1>
    
    <!-- PASO 1: Ingresar nombre de usuario -->
    <div id="panelVerificacion">
        <p>Escribe tu nombre de usuario de Roblox para activar el script:</p>
        <input type="text" id="userInput" class="input-box" placeholder="Tu nick de Roblox...">
        <button onclick="iniciarVerificacion()" class="registrar-btn">Conectar</button>
    </div>

    <!-- PASO 2: Anuncios automáticos y latido -->
    <div id="panelActivo">
        <p class="alerta">⚠️ NO CIERRES ESTA PÁGINA ⚠️</p>
        <p>Conectado como: <strong id="nombreMostrado" style="color: #4CAF50;"></strong></p>
        <p>Si cierras esta pestaña, serás expulsado del juego automáticamente.</p>

        <div class="ad-container">
            <p style="color: #aaa; margin-bottom: 10px;">Publicidad Patrocinada:</p>
            
            <!-- AQUÍ VA EL CÓDIGO DE ANUNCIO AUTOMÁTICO DE ADSTERRA (Banner o Social Bar) -->
            <!-- Si tienes un código de banner tipo script de Adsterra, pégalo aquí abajo: -->
            
            <script type="text/javascript">
                atOptions = {
                    'key' : 'bd2fca3e002c291d9ace7b7e65943b8f',
                    'format' : 'iframe',
                    'height' : 90,
                    'width' : 728,
                    'params' : {}
                };
            </script>
            <script type="text/javascript" src="//www.effectivecpmnetwork.com/bd2fca3e002c291d9ace7b7e65943b8f/invoke.js"></script>

        </div>
    </div>

    <script>
        let firebaseUrl = "";

        function iniciarVerificacion() {
            const usuario = document.getElementById('userInput').value.trim();

            if (!usuario) {
                alert("Por favor, escribe un nombre de usuario válido.");
                return;
            }

            document.getElementById('panelVerificacion').style.display = 'none';
            document.getElementById('panelActivo').style.display = 'block';
            document.getElementById('nombreMostrado').innerText = usuario;

            firebaseUrl = `https://data-base-4e0f8-default-rtdb.firebaseio.com/usuarios/${usuario}.json`;

            function enviarLatido() {
                const tiempoActual = Math.floor(Date.now() / 1000); 
                fetch(firebaseUrl, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ ultimo_latido: tiempoActual })
                }).catch(error => console.error("Error al enviar latido:", error));
            }

            enviarLatido();
            setInterval(enviarLatido, 5000); 
        }

        // TRUCO DE CIERRE: Si el usuario cierra o recarga la pestaña, borramos el latido al instante
        window.addEventListener('beforeunload', function () {
            if (firebaseUrl) {
                navigator.sendBeacon(firebaseUrl, JSON.stringify({ ultimo_latido: 0 }));
            }
        });
    </script>
</body>
</html>
