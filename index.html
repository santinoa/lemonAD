<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>LemonAD Verification</title>
    <style>
        body { background-color: #1e1e1e; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .ad-container { margin-top: 15px; padding: 15px; border: 2px dashed #555; border-radius: 10px; background-color: #2a2a2a; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .input-box { padding: 12px; font-size: 16px; width: 250px; border-radius: 5px; border: none; text-align: center; }
        .registrar-btn { padding: 12px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #panelActivo { display: none; }
        .ad-slot { background: #ffffff; padding: 5px; border-radius: 5px; width: 100%; max-width: 728px; min-height: 90px; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <h1>Verificación LemonAD</h1>
    <div id="panelVerificacion">
        <p>Escribe tu usuario para activar:</p>
        <input type="text" id="userInput" class="input-box">
        <button onclick="iniciarVerificacion()" class="registrar-btn">Conectar</button>
    </div>

    <div id="panelActivo">
        <p style="color: #4CAF50;">✅ Conectado y enviando latidos al servidor.</p>
        <div class="ad-container">
            <!-- Los 4 slots de anuncios -->
            <div class="ad-slot"><script type="text/javascript">atOptions = {'key' : 'bd2fca3e002c291d9ace7b7e65943b8f', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {}};</script><script type="text/javascript" src="//www.effectivecpmnetwork.com/bd2fca3e002c291d9ace7b7e65943b8f/invoke.js"></script></div>
            <div class="ad-slot"><script type="text/javascript">atOptions = {'key' : 'bd2fca3e002c291d9ace7b7e65943b8f', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {}};</script><script type="text/javascript" src="//www.effectivecpmnetwork.com/bd2fca3e002c291d9ace7b7e65943b8f/invoke.js"></script></div>
            <div class="ad-slot"><script type="text/javascript">atOptions = {'key' : 'bd2fca3e002c291d9ace7b7e65943b8f', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {}};</script><script type="text/javascript" src="//www.effectivecpmnetwork.com/bd2fca3e002c291d9ace7b7e65943b8f/invoke.js"></script></div>
            <div class="ad-slot"><script type="text/javascript">atOptions = {'key' : 'bd2fca3e002c291d9ace7b7e65943b8f', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {}};</script><script type="text/javascript" src="//www.effectivecpmnetwork.com/bd2fca3e002c291d9ace7b7e65943b8f/invoke.js"></script></div>
        </div>
    </div>

    <script>
        let firebaseUrl = "";
        function iniciarVerificacion() {
            const usuario = document.getElementById('userInput').value.trim();
            if (!usuario) return;
            document.getElementById('panelVerificacion').style.display = 'none';
            document.getElementById('panelActivo').style.display = 'block';
            firebaseUrl = `https://data-base-4e0f8-default-rtdb.firebaseio.com/usuarios/${usuario}.json`;
            function enviarLatido() {
                fetch(firebaseUrl, { method: 'PATCH', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ ultimo_latido: Math.floor(Date.now() / 1000) }) }).catch(() => {});
            }
            setInterval(enviarLatido, 5000);
            enviarLatido();
        }
        window.addEventListener('beforeunload', () => { if(firebaseUrl) navigator.sendBeacon(firebaseUrl, JSON.stringify({ ultimo_latido: 0 })); });
    </script>
</body>
</html>
