<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LemonAD Verification</title>
    <style>
        body { background-color: #1e1e1e; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        .ad-container { margin-top: 15px; padding: 15px; border: 2px dashed #555; border-radius: 10px; background-color: #2a2a2a; width: 100%; max-width: 750px; margin-left: auto; margin-right: auto; display: flex; flex-direction: column; gap: 15px; align-items: center; }
        .input-box { padding: 12px; font-size: 16px; width: 250px; border-radius: 5px; border: none; text-align: center; margin-right: 10px; }
        .registrar-btn { padding: 12px 20px; font-size: 16px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        #panelVerificacion { margin-top: 20px; }
        #panelActivo { display: none; margin-top: 10px; }
        .consola-web { background: #000; color: #0f0; font-family: monospace; padding: 10px; border-radius: 5px; font-size: 12px; margin-top: 10px; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto; }
        .ad-slot { background: #ffffff; padding: 5px; border-radius: 5px; width: 100%; height: 95px; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .ad-slot iframe { width: 728px; height: 90px; border: none; background: transparent; }
    </style>
</head>
<body>
    <h1>Verificación LemonAD</h1>
    
    <div id="panelVerificacion">
        <p>Escribe tu nombre de usuario de Roblox para activar los anuncios:</p>
        <input type="text" id="userInput" class="input-box" placeholder="Tu nick de Roblox...">
        <button onclick="iniciarVerificacion()" class="registrar-btn">Conectar</button>
    </div>

    <div id="panelActivo">
        <p style="color: #ff4c4c; font-weight: bold;">⚠️ NO CIERRES ESTA PÁGINA (Puedes minimizarla) ⚠️</p>
        <p>Usuario conectado: <strong id="nombreMostrado" style="color: #4CAF50;"></strong></p>
        
        <!-- Consola web para que el jugador vea que sí está funcionando -->
        <div class="consola-web" id="consolaWeb">Iniciando conexión con Firebase...</div>

        <div class="ad-container">
            <div class="ad-slot" id="slot1"></div>
            <div class="ad-slot" id="slot2"></div>
            <div class="ad-slot" id="slot3"></div>
            <div class="ad-slot" id="slot4"></div>
        </div>
    </div>

    <script>
        function cargarAnuncios() {
            const slots = ['slot1', 'slot2', 'slot3', 'slot4'];
            slots.forEach(slotId => {
                const contenedor = document.getElementById(slotId);
                contenedor.innerHTML = ""; 
                const scriptOpt = document.createElement('script');
                scriptOpt.type = 'text/javascript';
                scriptOpt.text = "atOptions = { 'key' : 'bd2fca3e002c291d9ace7b7e65943b8f', 'format' : 'iframe', 'height' : 90, 'width' : 728, 'params' : {} };";
                const scriptInvoke = document.createElement('script');
                scriptInvoke.type = 'text/javascript';
                scriptInvoke.src = '//www.effectivecpmnetwork.com/bd2fca3e002c291d9ace7b7e65943b8f/invoke.js';
                contenedor.appendChild(scriptOpt);
                contenedor.appendChild(scriptInvoke);
            });
        }

        function iniciarVerificacion() {
            const usuario = document.getElementById('userInput').value.trim();
            if (!usuario) return;

            document.getElementById('panelVerificacion').style.display = 'none';
            document.getElementById('panelActivo').style.display = 'block';
            document.getElementById('nombreMostrado').innerText = usuario;

            cargarAnuncios();

            const firebaseUrl = `https://data-base-4e0f8-default-rtdb.firebaseio.com/usuarios/${usuario}.json`;

            // HILO EN SEGUNDO PLANO (WEB WORKER) - Evita que el navegador congele el latido
            const workerCode = `
                let url = "";
                self.onmessage = function(e) {
                    if (e.data.type === 'start') {
                        url = e.data.url;
                        setInterval(() => {
                            const tiempoActual = Math.floor(Date.now() / 1000);
                            fetch(url, {
                                method: 'PATCH',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ ultimo_latido: tiempoActual })
                            }).then(() => self.postMessage('ok')).catch(() => self.postMessage('error'));
                        }, 5000);
                    }
                };
            `;
            const blob = new Blob([workerCode], {type: 'application/javascript'});
            const worker = new Worker(URL.createObjectURL(blob));

            worker.onmessage = function(e) {
                const consola = document.getElementById('consolaWeb');
                const hora = new Date().toLocaleTimeString();
                if (e.data === 'ok') {
                    consola.innerHTML = `[✓] Señal enviada con éxito a las ${hora}<br>Estado: PROTEGIDO ANTI-MINIMIZAR`;
                    consola.style.color = "#0f0";
                } else {
                    consola.innerHTML = `[x] Fallo de conexión a las ${hora}<br>Reintentando...`;
                    consola.style.color = "red";
                }
            };

            // Iniciar el worker
            worker.postMessage({ type: 'start', url: firebaseUrl });
            
            // Si cierra la pestaña de verdad, enviamos el 0
            window.addEventListener('beforeunload', () => { 
                navigator.sendBeacon(firebaseUrl, JSON.stringify({ ultimo_latido: 0 })); 
            });
        }
    </script>
</body>
</html>
